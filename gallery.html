<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankoman</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  h1 {
    margin: 0 0 12px;
    font-size: 18px;
  }
  form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  input[name="owner"], input[name="repo"] { width: 150px; }
  input[name="path"] { width: 180px; }
  input[name="branch"] { width: 90px; }
  button {
    background: var(--accent);
    color: #0d1117;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { opacity: 0.9; }
  #status {
    padding: 20px;
    color: var(--muted);
    font-size: 14px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
    padding: 20px;
  }
  figure {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  figure img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    background: #010409;
  }
  figcaption {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  a.imglink { text-decoration: none; color: inherit; }

  /* lightbox */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: zoom-out;
  }
  #lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    border-radius: 6px;
  }
</style>
</head>
<body>

<header>
  <h1>GitHub Folder Gallery</h1>
  <form id="config-form">
    <input name="owner" placeholder="owner (e.g. octocat)" required>
    <input name="repo" placeholder="repo name" required>
    <input name="path" placeholder="path (optional, e.g. images)" value="">
    <input name="branch" placeholder="branch" value="main">
    <button type="submit">Load</button>
  </form>
</header>

<div id="status"></div>
<div id="grid"></div>

<div id="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
const form = document.getElementById('config-form');
const statusEl = document.getElementById('status');
const grid = document.getElementById('grid');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

const IMAGE_EXT = /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i;

function setStatus(msg) { statusEl.textContent = msg; }

async function loadGallery(owner, repo, path, branch) {
  grid.innerHTML = '';
  setStatus('Loading…');
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}`;

  try {
    const res = await fetch(apiUrl);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.message || `GitHub API returned ${res.status}`);
    }
    const items = await res.json();
    if (!Array.isArray(items)) {
      throw new Error('That path is a file, not a folder.');
    }

    const images = items.filter(it => it.type === 'file' && IMAGE_EXT.test(it.name));

    if (images.length === 0) {
      setStatus('No image files found in that folder.');
      return;
    }

    setStatus(`${images.length} image${images.length === 1 ? '' : 's'} found.`);

    for (const img of images) {
      const figure = document.createElement('figure');

      const link = document.createElement('a');
      link.className = 'imglink';
      link.href = '#';
      link.addEventListener('click', (e) => {
        e.preventDefault();
        lightboxImg.src = img.download_url;
        lightbox.style.display = 'flex';
      });

      const thumb = document.createElement('img');
      thumb.src = img.download_url;
      thumb.loading = 'lazy';
      thumb.alt = img.name;

      const caption = document.createElement('figcaption');
      caption.textContent = img.name;
      caption.title = img.name;

      link.appendChild(thumb);
      figure.appendChild(link);
      figure.appendChild(caption);
      grid.appendChild(figure);
    }
  } catch (err) {
    setStatus(`Error: ${err.message}`);
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const data = new FormData(form);
  const owner = data.get('owner').trim();
  const repo = data.get('repo').trim();
  const path = data.get('path').trim();
  const branch = data.get('branch').trim() || 'main';

  const params = new URLSearchParams({ owner, repo, path, branch });
  history.replaceState(null, '', '?' + params.toString());

  loadGallery(owner, repo, path, branch);
});

lightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
  lightboxImg.src = '';
});

// Auto-load from URL query params if present, e.g.
// gallery.html?owner=octocat&repo=Hello-World&path=images&branch=main
(function initFromQuery() {
  const params = new URLSearchParams(location.search);
  const owner = params.get('owner');
  const repo = params.get('repo');
  const path = params.get('path') || '';
  const branch = params.get('branch') || 'main';

  if (owner && repo) {
    form.owner.value = owner;
    form.repo.value = repo;
    form.path.value = path;
    form.branch.value = branch;
    loadGallery(owner, repo, path, branch);
  } else {
    setStatus('Enter a repo above and click Load.');
  }
})();
</script>

</body>
</html>
